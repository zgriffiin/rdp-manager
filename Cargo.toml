[package]
name = "rdp-manager"
version = "0.2.0"
edition = "2024"
description = "A simple, modern Remote Desktop connection manager for Windows"
license = "MIT"
repository = "https://github.com/zgriffiin/rdp-manager"
build = "build.rs"

[dependencies]
eframe = { version = "0.37", default-features = false, features = ["accesskit", "clipboard", "default_fonts", "glow"] }
egui = { version = "0.37", default-features = false, features = ["monochrome_emoji_fonts"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security_Credentials", "Win32_System_Registry"] }

[build-dependencies]
embed-resource = "3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
